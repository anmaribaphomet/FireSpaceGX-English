{# Mascot: uses static/img/apigx.png if it exists; otherwise the placeholder SVG #}
{% macro mascota(clase='') -%}
  <img class="mascota {{ clase }}" src="{{ url_for('static', filename='img/apigx.png') }}"
       onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/apigx.svg') }}'" alt="ApiGx">
{%- endmacro %}

{# Chart card with a how-to-read caption #}
{% macro grafica(id, titulo, leyenda, clase='') -%}
  <figure class="grafica {{ clase }}">
    <figcaption class="grafica__titulo">{{ titulo }}
      <button class="grafica__ayuda" type="button" aria-label="How to read it" data-ayuda>?</button>
    </figcaption>
    <div class="grafica__lienzo"><canvas id="{{ id }}"></canvas></div>
    <p class="grafica__leyenda"><strong>How to read it:</strong> {{ leyenda }}</p>
  </figure>
{%- endmacro %}
